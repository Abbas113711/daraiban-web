width:77px;height:77px;border-radius:50%;background:#102743;display:grid;place-items:center;text-align:center;font-size:11px;line-height:1.6;color:#c8ddf3}.status{border-top:1px solid #2a4868;margin-top:13px;padding-top:10px;color:#b8cbe0;font-size:11px;display:flex;align-items:center;justify-content:space-between;gap:8px;grid-column:1/-1}.pill{background:#243b55;color:#d6e8fa;padding:3px 9px;border-radius:20px}.titleline{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 9px}.titleline h2{font-size:17px;margin:0}.muted{color:var(--muted)}.small{font-size:11px}.cats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.cat{border:1px solid #2a4d72;border-radius:16px;background:linear-gradient(145deg,#183a61,#102947);color:white;min-width:0;padding:11px 4px;text-align:center}.cat .emoji{font-size:23px;display:block}.cat b{font-size:11px;display:block;white-space:nowrap}.cat span:last-child{display:block;font-size:10px;color:#bfd2e8;white-space:nowrap}.cat.selected{outline:2px solid #61b6ff}.account{display:flex;align-items:center;gap:10px;background:linear-gradient(110deg,#1b395d,#142d4d);border:1px solid #375271;border-radius:16px;padding:12px;margin:8px 0;width:100%;text-align:right;color:white}.avatar{width:41px;height:41px;flex-shrink:0;border-radius:12px;display:grid;place-items:center;background:#1f66d0;font-size:19px;font-weight:bold}.account .name{font-weight:bold;flex:1}.account .value{font-weight:bold;font-size:13px}.account .sub{color:var(--muted);font-size:11px}.gain{color:#6be9ae}.negative{color:#ff9aac}.split{display:flex;justify-content:space-between;align-items:center;gap:8px}.line{border-bottom:1px solid #29445f;padding:11px 0}.line:last-child{border:0}.btn{border:0;border-radius:12px;padding:10px 14px;background:#307ff0;color:#fff;font-weight:bold}.btn.secondary{background:#263e5a;color:#e8f4ff;border:1px solid #395c80}.btn.danger{background:#6e2d43}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px </style></head><body><main class="shell"><header class="top"><div class="brand"><div class="logo">📈</div><div><h1>دارایی‌بان</h1><small>نسخه ۱۲ خصوصی • ۱۰ حساب و گزارش دارایی</small></div></div><button class="iconbtn" onclick="go('settings')" aria-label="تنظیمات">⚙</button></header><div id="screen"><section class="panel"><h2>ارزش کل دارایی‌ها</h2><div class="big">۱٬۳۴۷٬۳۳۹٬۴۷۲ تومان</div><div class="note">۱۰ حساب · ۲۱ ردیف دارایی. در صورت نمایش فقط این کارت، مرورگر اجرای برنامه را محدود کرده است.</div></section></div></main><button id="fab" class="fab" onclick="openForm()" aria-label="افزودن دارایی">+</button><nav class="bottom"><div class="nav" id="nav"></div></nav>
<script>const INITIAL=[];const STORE='daraiban_v12_web_20261112';const HISTORY='daraiban_v12_web_changes_20261112';const groups=['سهام','صندوق سهامی','درآمد ثابت','طلا','نقره','رمزارز','مس','نقد'];const palette=['#4285F4','#20C997','#FFC857','#B084F5','#FF718B','#E38B52','#A7B5C9'];const fmt=n=>Math.round(Number(n)||0).toLocaleString('fa-IR');const money=n=>fmt(n)+' تومان';const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const initial=INITIAL.map((x,i)=>({...x,id:'seed'+i}));let rows;try{let p=JSON.parse(localStorage.getItem(STORE));rows=Array.isArray(p)?p:initial}catch(e){rows=initial}rows=rows.map(x=>x.group==='نقد'&&(x.cost===null||x.cost===undefined)?{...x,cost:Number(x.value)||0}:x);let logs;try{logs=JSON.parse(localStorage.getItem(HISTORY))||[]}catch(e){logs=[]}let page='home',filter='',account='',editId=null;const sum=(arr,k)=>arr.reduce((a,x)=>a+(Number(x[k])||0),0);const total=()=>sum(rows,'value');const knownProfit=(arr)=>arr.reduce((a,x)=>a+(x.cost===null||x.cost===undefined?0:(Number(x.value)||0)-(Number(x.cost)||0)),0);const pnl=()=>knownProfit(rows);const percent=(v,c)=>c>0?(v/c*100-100):0;const color=n=>n<0?'negative':'gain';function persist(){try{localStorage.setItem(STORE,JSON.stringify(rows));localStorage.setItem(HISTORY,JSON.stringify(logs))}catch(e){alert('ذخیره اطلاعات در مرورگر ممکن نشد. لطفاً خروجی پشتیبان بگیرید.')}}function log(t){logs.unshift({at:new Date().toLocaleString('fa-IR'),text:t});logs=logs.slice(0,100);persist()}function cat(g){if(['سهام','صندوق سهامی'].includes(g))return 'بورس و سهام';if(g==='درآمد ثابت')return 'درآمد ثابت';if(g==='طلا')return 'طلا';if(g==='نقره')return 'نقره';if(g==='رمزارز')return 'رمزارز';if(g==='مس')return 'مس';return sectionConfig.custom.includes(g)?g:'بانک و نقد'}const cats=['بورس و سهام','درآمد ثابت','طلا','نقره','رمزارز','مس','بانک و نقد'];const emojis=['📈','🏦','🥇','🥈','₿','🟠','💳'];const SECTION_KEY='daraiban_sections_web_v12';let sectionConfig;try{sectionConfig=JSON.parse(localStorage.getItem(SECTION_KEY))||{}}catch(e){sectionConfig={}}if(!Array.isArray(sectionConfig.custom))sectionConfig.custom=[];if(!Array.isArray(sectionConfig.hidden))sectionConfig.hidden=[];function allCats(){return [...cats,...sectionConfig.custom]}function shownCats(){return allCats().filter(c=>!sectionConfig.hidden.includes(c))}function catIcon(c){let i=cats.indexOf(c);return i<0?'📁':emojis[i]}function catColor(c){let i=allCats().indexOf(c);return palette[i%palette.length]}function saveSections(){try{localStorage.setItem(SECTION_KEY,JSON.stringify(sectionConfig))}catch(e){alert('تنظیمات دسته‌ها ذخیره نشد')}}function toggleSection(c){if(sectionConfig.hidden.includes(c))sectionConfig.hidden=sectionConfig.hidden.filter(x=>x!==c);else sectionConfig.hidden.push(c);saveSections();render()}function addSection(e){e.preventDefault();let el=document.getElementById('newSection'),name=el.value.trim();if(!name||name.length>35){alert('نام بخش را کوتاه و معتبر وارد کنید');return}if(allCats().includes(name)||groups.includes(name)){alert('این نام از قبل وجود دارد');return}sectionConfig.custom.push(name);sectionConfig.hidden=sectionConfig.hidden.filter(x=>x!==name);saveSections();el.value='';render()}function removeSection(c){if(!sectionConfig.custom.includes(c))return;let count=rows.filter(x=>x.group===c).length;if(count){alert('این بخش '+count.toLocaleString('fa-IR')+' دارایی دارد. ابتدا دارایی‌ها را به بخش دیگری منتقل کنید؛ اطلاعات مالی حذف نمی‌شود.');return}if(confirm('بخش «'+c+'» حذف شود؟')){sectionConfig.custom=sectionConfig.custom.filter(x=>x!==c);sectionConfig.hidden=sectionConfig.hidden.filter(x=>x!==c);saveSections();render()}}function sectionManager(){return `<section class="panel"><h3>مدیریت بخش‌های دارایی</h3><div class="note">با برداشتن تیک، فقط کارت آن بخش پنهان می‌شود؛ دارایی‌ها، ارزش کل و نمودار حذف نمی‌شوند. برای بخش جدید می‌توانید دارایی ثبت کنید.</div>${allCats().map(c=>`<div class="section-row"><label><input type="checkbox" ${sectionConfig.hidden.includes(c)?'':'checked'} onchange="toggleSection('${safe(c)}')"><span>${catIcon(c)} ${safe(c)}</span></label><span class="small muted">${money(catTotal(c))}</span>${sectionConfig.custom.includes(c)?`<button class="btn secondary" onclick="removeSection('${safe(c)}')">حذف بخش</button>`:''}</div>`).join('')}<form class="add-section" onsubmit="addSection(event)"><input id="newSection" maxlength="35" placeholder="نام بخش جدید؛ مثل ملک" required><button class="btn" type="submit">+ افزودن بخش</button></form></section>`}function catTotal(c){return sum(rows.filter(x=>cat(x.group)===c),'value')}function go(p,f=''){page=p;filter=f;render();window.scrollTo({top:0,behavior:'smooth'})}function nav(){let items=[['home','داشبورد','⌂'],['assets','دارایی‌ها','▤'],['transactions','تغییرات','⇄'],['history','تاریخچه','◷'],['reports','گزارش‌ها','▥']];document.getElementById('nav').innerHTML=items.map(([k,l,i])=>`<button class="${page===k?'active':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('');document.getElementById('fab').classList.toggle('hidden',page==='form')}function hero(){let val=total(),profit=pnl(),data=allCats().map((c,i)=>({c,v:catTotal(c),color:catColor(c)})).filter(x=>x.v>0);let cur=0;let parts=data.map(x=>{let start=cur;cur+=x.v/Math.max(val,1)*100;return `${x.color} ${start}% ${cur}%`});return `<section class="hero"><div><div class="eyebrow">ارزش کل دارایی‌ها</div><div class="big">${fmt(val)}<span class="unit">تومان</span></div><div class="profit ${profit<0?'loss':''}">${profit>=0?'+':''}${money(profit)} <span>(${rows.some(x=>x.cost==null)?'نامشخص':percent(val,sum(rows,'cost')).toFixed(2)+'٪'})</span></div></div><div class="donut" style="background:conic-gradient(${parts.join(',')||'#24415d 0 100%'})"><div class="hole">ترکیب<br>دارایی‌ها</div></div><div class="status"><span>◉ قیمت‌ها: ثبت‌شده / غیرزنده</span><span class="pill">آفلاین</span></div></section>`}function categoryCards(){return `<div class="cats">${shownCats().map((c,i)=>`<button class="cat" onclick="go('assets','${c}')"><span class="emoji">${catIcon(c)}</span><b>${c}</b><span>${(catTotal(c)/1e6).toLocaleString('fa-IR',{maximumFractionDigits:1})} م</span></button>`).join('')}</div>`}function accounts(){let names=[...new Set(rows.map(x=>x.account))];return names.map((name,i)=>{let rr=rows.filter(x=>x.account===name),v=sum(rr,'value'),p=knownProfit(rr);return `<button class="account" onclick="account=${JSON.stringify(name).replace(/"/g,'&quot;')};go('account')"><span class="avatar" style="background:${['#2164c2','#236b94','#5049a1','#23796b'][i%4]}">${name.includes('مفید')?'م':name.includes('کیان')?'K':'◆'}</span><span class="name">${safe(name)}<div class="sub">${rr.length.toLocaleString('fa-IR')} دارایی</div></span><span><span class="value">${money(v)}</span><div class="sub ${color(p)}">${p===null?'نامشخص':(p>=0?'+':'')+money(p)}</div></span><span>‹</span></button>`}).join('')}function home(){return hero()+`<div class="titleline"><h2>گروه‌های دارایی</h2><button class="btn secondary" onclick="go('sections')">⚙ مدیریت بخش‌ها</button></div>`+categoryCards()+`<div class="titleline"><h2>ترکیب دارایی‌ها</h2></div><section class="panel"><div class="chartbar">${allCats().map((c,i)=>`<span style="width:${catTotal(c)/Math.max(total(),1)*100}%;background:${catColor(c)}"></span>`).join('')}</div><div class="legend">${allCats().map((c,i)=>`<div><i class="dot" style="background:${catColor(c)}"></i>${c}: ${((catTotal(c)/Math.max(total(),1))*100).toFixed(1)}٪</div>`).join('')}</div><div class="footnote">بورس و سهام شامل سهام مستقیم و صندوق‌های سهامی است؛ درآمد ثابت جداگانه محاسبه می‌شود. نمودار روند زمانی بدون داده تاریخی معتبر نمایش داده نمی‌شود.</div></section><div class="titleline"><h2>حساب‌ها و کارگزاری‌ها</h2><button class="btn secondary" onclick="go('assets')">همه دارایی‌ها</button></div>${accounts()}<section class="panel"><h3 class="subhead">وضعیت اتصال بورس</h3><div class="note">قیمت زنده بورس هنوز فعال نیست؛ آزمایش ارتباط به معنی دریافت قیمت نمادها نیست. برای امنیت، هیچ اطلاعات ورود کارگزاری دریافت نمی‌شود.</div><div class="actions"><button class="btn secondary" onclick="checkBourse()">بررسی واقعی ارتباط بورس (فملی)</button><div id="bourse-test" class="note" role="status" aria-live="polite">این آزمایش جست‌وجوی نماد و قیمت پایانی را بررسی می‌کند؛ نه بروزرسانی خودکار سبد.  بورس را بررسی می‌کند و قیمت دارایی‌ها را تغییر نمی‌دهد.</div></div></section>`}function listing(arr){return arr.length?arr.map(x=>{let p=x.cost==null?null:(+x.value||0)-(+x.cost||0);return `<div class="line"><div class="split"><b>${safe(x.symbol)}</b><b>${money(x.value)}</b></div><div class="split small muted"><span>${safe(x.account)} · ${safe(x.group)} · ${fmt(x.qty)} ${safe(x.unit||'واحد')}</span><span class="${color(p)}">${p===null?'نامشخص':(p>=0?'+':'')+money(p)}</span></div><div class="actions"><button class="btn secondary" onclick="openForm('${x.id}')">ویرایش</button><button class="btn secondary" onclick="removeRow('${x.id}')">حذف</button></div></div>`}).join(''):'<div class="empty">دارایی‌ای در این بخش ثبت نشده است.</div>'}function assets(){let arr=rows.filter(x=>!filter||cat(x.group)===filter||x.group===filter);return `<div class="titleline"><h2>دارایی‌ها</h2><button class="btn secondary" onclick="go('assets')">نمایش همه</button></div><div class="actions">${['همه',...allCats()].map(c=>`<button class="btn ${(!filter&&c==='همه')||filter===c?'':'secondary'}" onclick="go('assets','${c==='همه'?'':c}')">${c}</button>`).join('')}</div><section class="panel"><div class="split"><b>${filter||'همه دارایی‌ها'}</b><b>${money(sum(arr,'value'))}</b></div>${listing(arr)}</section>`}function accountPage(){let rr=rows.filter(x=>x.account===account);return `<button class="btn secondary" onclick="go('home')">بازگشت</button><section class="panel"><h2>${safe(account)}</h2><div class="big">${money(sum(rr,'value'))}</div>${listing(rr)}</section>`}function reports(){let g=[...groups,...sectionConfig.custom].map(g=>({g,v:sum(rows.filter(x=>x.group===g),'value'),p:knownProfit(rows.filter(x=>x.group===g))}));return `<h2>گزارش دارایی‌ها</h2><section class="panel">${g.map(x=>`<div class="line"><div class="split"><b>${x.g}</b><b>${money(x.v)}</b></div><div class="small ${color(x.p)}">سود/زیان ثبت‌شده: ${money(x.p)}</div></div>`).join('')}</section><div class="note">وجه نقد سود صفر دارد و دارایی‌های با بهای خرید نامشخص از محاسبه سود کنار گذاشته می‌شوند. سود و زیان از اطلاعات ثبت‌شده محاسبه می‌شود. به دلیل اختلاف‌های موجود در برخی داده‌های اولیه، این گزارش حسابرسی‌شده نیست و برای تصمیم خریدوفروش قابل اتکا نیست.</div>`}function history(){return `<h2>تاریخچه تغییرات</h2><section class="panel">${logs.length?logs.map(l=>`<div class="line"><b>${safe(l.text)}</b><div class="muted small">${safe(l.at)}</div></div>`).join(''):'<div class="empty">هنوز تغییری در این نسخه ثبت نشده است.</div>'}</section>`}function settings(){return `<h2>تنظیمات و پشتیبان‌گیری</h2><div class="actions"><button class="btn secondary" onclick="go('sections')">مدیریت بخش‌های دارایی</button></div><section class="panel"><h3>اطلاعات من</h3><div class="note">داده‌ها فقط در حافظه همین مرورگر ذخیره می‌شوند. این ذخیره‌سازی رمزنگاری اختصاصی یا پشتیبان ابری ندارد. اگر داده حساس است، از نسخه آزمایشی برای نگهداری اصلی استفاده نکنید.</div><div class="actions"><button class="btn" onclick="backup()">دریافت پشتیبان JSON</button><label class="btn secondary" style="cursor:pointer">بازیابی پشتیبان<input type="file" accept=".json,application/json" style="display:none" onchange="restore(event)"></label><button class="btn secondary" onclick="reset()">پاک‌کردن اطلاعات</button></div></section><section class="panel"><h3>قیمت‌های بازار</h3><div class="note warning">اتصال زنده به بورس تهران فعال نیست؛ زمان به‌روزرسانی بازار قابل تأیید نیست.</div></section>`}function form(){let x=rows.find(x=>x.id===editId)||{account:'',group:'سهام',symbol:'',qty:0,unit:'واحد',value:0,cost:0,note:''};let accounts=[...new Set(rows.map(x=>x.account))];return `<button class="btn secondary" onclick="go('assets')">بازگشت</button><section class="panel"><h2>${editId?'ویرایش دارایی':'افزودن دارایی'}</h2><form onsubmit="saveForm(event)"><div class="formgrid"><label class="field wide">نام دارایی یا نماد<input id="symbol" required value="${safe(x.symbol)}"></label><label class="field">حساب<input id="account" list="accounts" required value="${safe(x.account)}"><datalist id="accounts">${accounts.map(a=>`<option value="${safe(a)}">`).join('')}</datalist></label><label class="field">گروه<select id="group">${[...groups,...sectionConfig.custom].map(g=>`<option ${g===x.group?'selected':''}>${g}</option>`).join('')}</select></label><label class="field">تعداد<input id="qty" type="number" min="0" step="any" required value="${x.qty}"></label><label class="field">واحد<input id="unit" value="${safe(x.unit)}"></label><label class="field">ارزش فعلی (تومان)<input id="value" type="number" min="0" step="any" required value="${x.value}"></label><label class="field">بهای تمام‌شده (تومان)<input id="cost" type="number" min="0" step="any" required value="${x.cost==null?'':x.cost}"></label><label class="field wide">یادداشت<input id="note" value="${safe(x.note)}"></label></div><div class="actions"><button class="btn" type="submit">ذخیره دارایی</button></div></form></section>`}function openForm(id=null){editId=id;go('form')}function saveForm(e){e.preventDefault();let x={id:editId||'new'+Date.now(),symbol:document.getElementById('symbol').value.trim(),account:document.getElementById('account').value.trim(),group:document.getElementById('group').value,qty:+document.getElementById('qty').value,unit:document.getElementById('unit').value.trim(),value:+document.getElementById('value').value,cost:document.getElementById('cost').value.trim()===''?null:+document.getElementById('cost').value,note:document.getElementById('note').value.trim()};if(!x.symbol||!x.account||[x.qty,x.value,...(x.cost==null?[]:[x.cost])].some(n=>!Number.isFinite(n)||n<0)){alert('مقادیر واردشده معتبر نیستند.');return}if(editId){rows=rows.map(r=>r.id===editId?x:r)}else rows.push(x);log((editId?'ویرایش':'افزودن')+' '+x.symbol+' در '+x.account);editId=null;go('assets')}function removeRow(id){let x=rows.find(r=>r.id===id);if(x&&confirm('دارایی «'+x.symbol+'» حذف شود؟')){rows=rows.filter(r=>r.id!==id);log('حذف '+x.symbol);render()}}function backup(){let data={version:9,exportedAt:new Date().toISOString(),rows,logs,sectionConfig};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='daraiban-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}function restore(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(d.format==='daraiban-v2'&&Array.isArray(d.assets)){const lookup={stocks:'سهام',funds:'صندوق سهامی',gold:'طلا',crypto:'رمزارز',cash:'نقد'};d.rows=d.assets.map((x,i)=>({id:String(x.id||'import'+i),account:String(x.account||'سایر'),group:lookup[x.group]||'مس',symbol:String(x.name||x.symbol||'دارایی'),qty:Number(x.qty)||0,unit:'واحد',value:Number(x.value)||0,cost:x.cost==null?null:Number(x.cost),note:'واردشده از پشتیبان خصوصی'}));}if(!Array.isArray(d.rows)||!d.rows.every(x=>typeof x.symbol==='string'&&typeof x.account==='string'&&Number.isFinite(+x.value)&&(x.cost==null||Number.isFinite(+x.cost))))throw Error();if(!confirm('اطلاعات فعلی با فایل پشتیبان جایگزین شود؟'))return;rows=d.rows.map((x,i)=>({...x,id:String(x.id||'import'+i)}));logs=Array.isArray(d.logs)?d.logs:[];if(d.sectionConfig&&Array.isArray(d.sectionConfig.custom)&&Array.isArray(d.sectionConfig.hidden)){sectionConfig={custom:d.sectionConfig.custom.filter(x=>typeof x==='string'&&x.length<=35),hidden:d.sectionConfig.hidden.filter(x=>typeof x==='string')};saveSections()}log('بازیابی پشتیبان');go('home')}catch(err){alert('فایل پشتیبان معتبر نیست.')}};reader.readAsText(f)}function reset(){if(confirm('همه تغییرات این نسخه پاک و اطلاعات اولیه بازیابی شود؟')){rows=initial.map(x=>({...x}));logs=[];persist();go('home')}}function render(){nav();document.getElementById('screen').innerHTML=({home,assets,account:accountPage,reports,history,transactions:history,settings,sections:sectionManager,form})[page]();}render();async function checkBourse(){
 const el=document.getElementById('bourse-test');if(!el)return;
 const now=()=>new Date().toLocaleString('fa-IR');
 const fail=(message)=>{el.textContent='❌ '+message+' | بررسی: '+now()+' | هیچ قیمت یا دارایی تغییر نکرد.'};
 el.textContent='در حال آزمایش واقعی جست‌وجوی نماد و دریافت قیمت از بورس تهران…';
 if(!navigator.onLine){fail('مرورگر وضعیت آفلاین گزارش می‌کند.');return}
 const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),15000);
 try{
  const base='https://cdn.tsetmc.com/api/';
  const get=async path=>{
   const res=await fetch(base+path,{mode:'cors',cache:'no-store',signal:ctl.signal,headers:{'Accept':'application/json'}});
   if(!res.ok)throw new Error('پاسخ HTTP '+res.status);
   const type=res.headers.get('content-type')||'';
   if(!type.includes('json'))throw new Error('سرویس پاسخ JSON برنگرداند');
   return await res.json();
  };
  const found=await get('Instrument/GetInstrumentSearch/'+encodeURIComponent('فملی'));
  const list=found&&found.instrumentSearch;
  if(!Array.isArray(list)||list.length===0)throw new Error('جست‌وجوی نماد داده معتبر برنگرداند');
  const normalize=t=>String(t||'').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\s/g,'');
  const hit=list.find(x=>normalize(x.lVal18AFC)==='فملی'&&/^\d+$/.test(String(x.insCode||'')));
  if(!hit)throw new Error('نماد دقیق «فملی» در پاسخ پیدا نشد');
  const quote=await get('ClosingPrice/GetClosingPriceInfo/'+hit.insCode);
  const q=quote&&quote.closingPriceInfo;
  const rial=Number(q&&(q.pClosing??q.pc));
  if(!Number.isFinite(rial)||rial<=0)throw new Error('قیمت پایانی معتبر دریافت نشد');
  el.textContent='✅ اتصال داده تأیید شد: جست‌وجوی «فملی» و قیمت پایانی '+rial.toLocaleString('fa-IR')+' ریال ('+(rial/10).toLocaleString('fa-IR')+' تومان) دریافت شد. زمان آزمایش: '+now()+'. این آزمایش فقط یک نماد است؛ به‌روزرسانی خودکار سبد هنوز فعال نیست و داده ممکن است مربوط به آخرین جلسه معاملات باشد.';
 }catch(err){
  const msg=err.name==='AbortError'?'مهلت ۱۵ ثانیه‌ای تمام شد':err instanceof TypeError?'مرورگر نتوانست به سرویس دسترسی پیدا کند؛ احتمال محدودیت CORS یا شبکه':String(err.message||err);
  fail(msg);
 }finally{clearTimeout(timer)}
}
if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
